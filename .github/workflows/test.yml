name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Unit tests only. The integration tests need a running engine; run them with
# scripts/integration.sh.

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-version_test.sh

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    strategy:
      matrix:
        node-version: ["18", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test

  python:
    # 24.04, not latest: setup-python has no 3.9 for Ubuntu 26.04, and 3.9 is
    # the floor pyproject.toml promises, so it is the version worth testing.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
